# QoS overrides for `ros2 bag play` (see rosbag_play.launch.py).
#
# The sensor topics were recorded from publishers offering SENSOR_DATA
# (best_effort) QoS, and rosbag2 replays a topic with the QoS it was recorded
# with. A best_effort publisher is incompatible with the default reliable
# subscriber, so the decompressing `republish` nodes -- which do not expose a
# QoS parameter -- would receive nothing. Publishing these topics as reliable
# instead is compatible with both: reliable publisher -> best_effort
# subscriber is a valid match, so nodes using SENSOR_DATA still work.
/head_camera/d435/color/image_raw:
  reliability: reliable
  history: keep_last
  depth: 10
/head_camera/d435/color/image_raw/compressed:
  reliability: reliable
  history: keep_last
  depth: 10
/head_camera/d435/depth/image_rect_raw:
  reliability: reliable
  history: keep_last
  depth: 10
/head_camera/d435/depth/image_rect_raw/compressedDepth:
  reliability: reliable
  history: keep_last
  depth: 10
/head_camera/d435/depth/color/points:
  reliability: reliable
  history: keep_last
  depth: 5
/head_camera/d435/depth/color/points/zstd:
  reliability: reliable
  history: keep_last
  depth: 5
/livox/lidar:
  reliability: reliable
  history: keep_last
  depth: 5
/livox/lidar/zstd:
  reliability: reliable
  history: keep_last
  depth: 5
/livox/imu:
  reliability: reliable
  history: keep_last
  depth: 100
