name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  ci:
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/master' && matrix.runner == 'ubuntu-24.04-arm'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: ros-industrial/industrial_ci@master
        env:
          ROS_DISTRO: jazzy
          UPSTREAM_WORKSPACE: .github/upstream.jazzy.repos
          UPSTREAM_CMAKE_ARGS: --packages-select g1_description unitree_sdk2
          ROSDEP_SKIP_KEYS: catkin g1_description gazebo message_generation message_runtime roscpp roslaunch rviz unitree_sdk2
          DOCKER_COMMIT: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      - name: Push image
        if: github.event_name == 'push' && github.ref == 'refs/heads/master' && matrix.runner == 'ubuntu-24.04-arm'
        run: docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
